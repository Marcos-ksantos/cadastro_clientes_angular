<div id="div-form">

    <h4>CADASTRO CLIENTES</h4>

    <form id="formulario">

        <label for="nome">Insira seu nome</label>
        <input type="text" name="nome" id="nome" [(ngModel)]="nome_cliente">

        <label for="email">Insira seu email</label>
        <input type="email" name="email" id="email" [(ngModel)]="email_cliente">

        <label for="cpf">Insira seu CPF</label>
        <input type="text" name="cpf" id="cpf" [(ngModel)]="cpf_cliente">

        <label for="data">Insira sua Data de nascimento</label>
      
        <input type="date" name="data" id="data" [(ngModel)]="data_cliente">

        <label for="uf">Insira seu UF</label>
        <select name="uf" id="uf" [(ngModel)]="uf_cliente">
            <option value="">Selecione um estado</option>
            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
          </select>

        <label for="municipio">Insira seu Município</label>
        <input type="text" name="municipio" id="municipio" [(ngModel)]="municipio_cliente">

        <button type="button" id="btnAdd"(click)="addClientes()">Adicionar</button>
        <button type="button" id="btnLimpar"(click)="limparTudo()">Limpar tudo</button>
    </form>

    <div id="listar">

        @for(elem of listaClientes; track elem.idCliente){
        <span>
            {{elem.nomeCliente}} <br>
            {{elem.emailCliente}} <br>
            {{elem.cpfCliene}} <br>
            {{elem.dataCliente}}
            {{elem.ufCliente}} <br>
            {{elem.municipioCliente}} <br>
        </span>

        }@empty{

        <div class="div-item"> Nenhum Cliente cadastrado.</div>
        }

    </div>
</div>
